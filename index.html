<style>

*{box-sizing:border-box}

.logos{display:flex;align-items:center;justify-content:center;gap:18px;background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px}.logos img{height:58px;width:auto;max-width:30%;object-fit:contain}.logos img:nth-child(2){height:70px}

.fl{display:flex;gap:10px;justify-content:center;position:relative}.fl svg{width:30%;max-width:118px;animation:fl 4s ease-in-out infinite alternate}.fl img{width:30%;max-width:118px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:2px solid #e1b955;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:fl 4s ease-in-out infinite alternate}.fl img:nth-child(2){animation-delay:.8s}.fl img:nth-child(3){animation-delay:1.6s}.pc img.ph{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.fl svg:nth-child(2){animation-delay:.8s}.fl svg:nth-child(3){animation-delay:1.6s}

.hintbox{border-inline-start:4px solid var(--gold);padding:8px 12px;margin-top:10px;background:var(--card);border-radius:10px}
.msg{color:var(--bad);font-weight:700;margin-top:10px}.ok{color:var(--ok);font-weight:700}

.happy{text-align:center;border-color:var(--gold)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}html{scroll-behavior:auto}}

en:{n:"Hatshepsut",story:"Hatshepsut ruled Egypt for about two decades in the 15th century BCE and built her terraced temple at Deir el-Bahari.",d:"A bold leader who writes her own rules."},
S:[{e:"🗿",ar:{n:"تمثال حتشبسوت",c:"وُلدتُ أميرة لكنني حكمتُ كملك. ابحث عن تمثالي.",h:"يُصوَّر تمثالها غالبًا بلحية الملك الاحتفالية رغم أنها امرأة."},en:{n:"Statue of Hatshepsut",c:"I was born a princess, yet I ruled as a king. Find my statue.",h:"Her statues often show the ceremonial false beard, though she was a woman."}},
{e:"📜",ar:{n:"نقش بعثة بونت",c:"أرسلتُ أسطولًا إلى أرض بونت فعاد محمّلًا بالبخور والأشجار. ابحث عن نقش يروي الرحلة.",h:"يُظهر النقش سفنًا ومشاهد تجارة."},en:{n:"Punt expedition relief",c:"I sent a fleet to the land of Punt and it returned with incense and trees. Find the relief that tells the voyage.",h:"The relief shows ships and trading scenes."}},
{e:"🦁",ar:{n:"أبو الهول حتشبسوت",c:"صوّرني الفنانون بجسد أسد ووجه ملك. ابحث عن تمثال أبي الهول الخاص بي.",h:"وجهه ملكي يرتدي غطاء الرأس الملكي."},en:{n:"Sphinx of Hatshepsut",c:"Artists showed me with a lion’s body and a king’s face. Find my sphinx statue.",h:"Its face is royal, wearing the royal headcloth."}}]},
{c:["#1b4c9a","#e3b53f"],cr:'<path d="M50 40q10-8 20 0" stroke="#e3b53f" stroke-width="4" fill="none"/>',e:"🏺",
ar:{n:"توت عنخ آمون",story:"اكتُشفت مقبرته عام 1922 وفيها آلاف القطع، وغيّرت نظرة العالم إلى مصر القديمة.",d:"فضولي ومغامر، وأسطورة باقية."},
en:{n:"Tutankhamun",story:"His tomb, found in 1922, held thousands of objects and changed how the world saw ancient Egypt.",d:"Curious and fearless, and a lasting legend."},
S:[{e:"😷",ar:{n:"القناع الذهبي",c:"ملكٌ صغير اعتلى العرش وهو فتى. ابحث عن قناعه الجنائزي الذهبي.",h:"ذهب مطعّم بالأزرق."},en:{n:"Golden funerary mask",c:"A boy king took the throne very young. Find his golden funerary mask.",h:"Gold with blue inlay."}},
{e:"🪑",ar:{n:"العرش الذهبي",c:"جلستُ على عرش مغطى بالذهب، وعلى ظهره مشهد يجمعني بزوجتي. ابحث عن عرشي.",h:"على ظهر العرش صورة الملك مع زوجته أنخسن آمون."},en:{n:"Golden throne",c:"I sat on a throne covered in gold, with a scene of me and my wife on its back. Find my throne.",h:"The back shows the king with his wife Ankhesenamun."}},
{e:"🛞",ar:{n:"العربة الملكية",c:"أحببتُ الصيد وركوب العربات. ابحث عن عربتي.",h:"عُثر على عدة عربات داخل مقبرته."},en:{n:"Royal chariot",c:"I loved hunting and riding chariots. Find my chariot.",h:"Several chariots were found in his tomb."}}]},
{c:["#0f6b6b","#d9b04a"],cr:'<path d="M44 52Q60 6 76 52Z" fill="#2b5fc7"/>',e:"🗿",
ar:{n:"رمسيس الثاني",story:"حكم رمسيس الثاني نحو 66 عامًا وملأ مصر بالمعابد والتماثيل، وصورته تشكّل ما يتخيله كثيرون عن الفرعون.",d:"طموح وصاحب إرث يدوم."},
en:{n:"Ramesses II",story:"Ramesses II ruled about 66 years and filled Egypt with temples and statues; his image shapes how many people picture a pharaoh.",d:"Ambitious, with a legacy built to last."},
S:[{e:"🗿",ar:{n:"التمثال الضخم لرمسيس",c:"حكمتُ نحو 66 عامًا. ابحث عن تمثالي الضخم.",h:"يلقّبه التاريخ برمسيس العظيم."},en:{n:"Colossus of Ramesses",c:"I ruled for about 66 years. Find my colossal statue.",h:"History remembers him as Ramesses the Great."}},
{e:"⚔️",ar:{n:"نقش معركة قادش",c:"خضتُ معركة شهيرة ضد الحيثيين وسجّلتها على جدران المعابد. ابحث عن نقش المعركة.",h:"جرت المعركة قرب نهر العاصي."},en:{n:"Battle of Kadesh relief",c:"I fought a famous battle against the Hittites and recorded it on temple walls. Find the battle relief.",h:"The battle took place near the Orontes river."}},
{e:"👸",ar:{n:"تمثال نفرتاري",c:"أحببتُ ملكتي وبنيتُ لها معبدًا بجوار معبدي في أبو سمبل. ابحث عن تمثالها.",h:"اسمها نفرتاري."},en:{n:"Statue of Nefertari",c:"I loved my queen and built her a temple beside mine at Abu Simbel. Find her statue.",h:"Her name was Nefertari."}}]}];

return `<svg viewBox="0 0 300 400" class="scn" role="img" aria-label="${k(i).n}"><defs><linearGradient id="${d}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c76b"/><stop offset=".6" stop-color="#e98f4a"/><stop offset="1" stop-color="#5a2f2a"/></linearGradient><linearGradient id="${d}c" x1="0" x2="1"><stop offset="0" stop-color="#8a6a2e"/><stop offset=".5" stop-color="#e7c46a"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><linearGradient id="${d}k" x1="0" x2="1"><stop offset="0" stop-color="#b98650"/><stop offset=".5" stop-color="#d9a771"/><stop offset="1" stop-color="#a87444"/></linearGradient></defs><rect width="300" height="400" fill="url(#${d}s)"/><circle cx="150" cy="170" r="78" fill="#fff3c4" opacity=".5"/><circle cx="150" cy="170" r="46" fill="#fff8de"/><path d="M0 330L80 240L150 330ZM120 330L215 215L300 330Z" fill="#b3693a" opacity=".55"/>${col}<rect y="332" width="300" height="68" fill="#3b2420"/><path d="M0 332H300" stroke="#e7c46a" stroke-width="3"/><path d="M70 332q-4-70 6-96M76 236q-24-6-34 6M76 236q-6-24-30-24M76 236q20-14 38-4M76 236q10-22 36-18M232 332q4-60-4-84M228 248q-22-4-32 8M228 248q-4-22-28-22M228 248q20-12 36-2" stroke="#2f5d34" stroke-width="3" fill="none"/><ellipse cx="150" cy="378" rx="62" ry="9" fill="#000" opacity=".3"/><path d="M92 238Q150 222 208 238L202 312L98 312Z" fill="url(#${d}k)"/><ellipse cx="88" cy="278" rx="12" ry="42" fill="url(#${d}k)"/><ellipse cx="212" cy="278" rx="12" ry="42" fill="url(#${d}k)"/><rect x="76" y="262" width="24" height="7" fill="${b}"/><rect x="200" y="262" width="24" height="7" fill="${b}"/><path d="M100 308L200 308L214 376L86 376Z" fill="#f6f1e4"/><path d="M114 308L108 376M128 308L125 376M142 308L142 376M158 308L158 376M172 308L175 376M186 308L192 376" stroke="#cfc6ae" stroke-width="1.5"/><rect x="98" y="300" width="104" height="11" fill="${b}"/><circle cx="150" cy="305" r="5" fill="#1f8a8a"/><path d="M236 250V380" stroke="${b}" stroke-width="5" stroke-linecap="round"/><ellipse cx="236" cy="236" rx="9" ry="12" fill="none" stroke="${b}" stroke-width="4"/><path d="M222 252H250" stroke="${b}" stroke-width="5" stroke-linecap="round"/><g transform="translate(90,100)">${ptIn(i)}</g><path d="M96 252Q150 226 204 252" stroke="#e7c46a" stroke-width="14" fill="none" opacity=".0"/></svg>`}
function qr(id,c){let r="",v=id*7+3;for(let y=0;y<9;y++)for(let x=0;x<9;x++){v=(v*1103515245+12345)&0x7fffffff;if(((x<3&&y<3)||(x>5&&y<3)||(x<3&&y>5))||v%3===0)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="0 0 9 9" class="qr ${c||""}" fill="currentColor" aria-hidden="true">${r}</svg>`}
function init(l){s={lang:l||s.lang,ki:0,si:0,sc:0,h:0,st:"intro",msg:"",good:"",opts:[],qi:0,tl:[0,0,0],ph:"",kr:0,cp:[],back:"intro",sid:0,ln:""};draw()}
function nav(){const on=s.st!=="intro";return `<div><b class="brand">🏺 ${t("title")}</b><span class="sp"></span><button class="lang" onclick="tog()">${t("tog")}</button>${on?`<button class="lang" onclick="openRw()" aria-label="${t("rwH")}">🎁</button><span class="pts" aria-live="polite">${s.sc} ${t("pts")}</span>`:`<button class="cta" onclick="go()">${t("go")}</button>`}</div>`}
function dots(){const d=/^(q|res)$/.test(s.st)?3:s.ki+(s.st==="rew"?1:0);return `<div class="dots" aria-hidden="true">${K.map((_,j)=>`<i class="${j<d?"on":""}"></i>`).join("")}</div>`}
function draw(keep){document.documentElement.lang=s.lang;document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";let h="";
if(s.st==="intro")h=`<div class="logos">${LG.map(x=>`<img src="${x}" alt="">`).join("")}</div><section class="hero2"><div class="sun"></div><div class="fl">${PH.map((x,i)=>`<img src="${x}" alt="${k(i).n}" style="object-position:${OP[i]}">`).join("")}</div><h1>${t("title")}</h1><p>${t("sub")}</p><button class="cta big" onclick="go()">${t("go")}</button></section><div class="stats rv"><div><b data-n="3">0</b><span>${t("l1")}</span></div><div><b data-n="9">0</b><span>${t("l2")}</span></div><div><b data-n="1050">0</b><span>${t("pts")}</span></div><div><b data-n="4">0</b><span>${t("rwH")}</span></div></div><div class="card rv"><h3>⚠️ ${t("pH")}</h3><p>${t("p")}</p></div><div class="card rv"><h3>💡 ${t("iH")}</h3><p>${t("i")}</p></div><h2 class="rv">${t("meet")}</h2><div class="rail rv">${K.map((x,i)=>`<div class="pc"><img class="ph" src="${PH[i]}" alt="${x[s.lang].n}" style="object-position:${OP[i]}"><div><h3>${x[s.lang].n}</h3><p>${x[s.lang].d}</p></div></div>`).join("")}</div><p class="note rv">${t("imgN")}</p><h2 class="rv">${t("hH")}</h2><div class="grid rv">${t("st").map((x,i)=>`<div class="card"><span class="em">${["📖","🔍","📷","🏆"][i]}</span>${x}</div>`).join("")}</div><h2 class="rv">${t("rwT")}</h2><div class="chips rv">${R.map(r=>`<span>${r.e} ${r[s.lang]}</span>`).join("")}</div><button class="btn rv" onclick="go()">${t("go")}</button><p class="note">${t("fine")}</p><div class="foot"><b>${t("by")}</b>${t("aff")}</div>`;
else if(s.st==="ch"){const c=cur();h=dots()+`<span class="tag">${t("rid")} ${s.ki+1} ${t("of")} 3 · ${t("stg")} ${s.si+1} ${t("of")} 3</span>${s.good?`<p class="ok">${s.good}</p>`:""}<div class="cart"><p>${c.c}</p></div><div class="lock">${t("lock")}</div>${s.h?`<div class="hintbox"><b>${t("hl")}</b> ${c.h}</div>`:`<button class="btn alt" onclick="hint()">${t("hint")}</button>`}<button class="btn" onclick="chk()">📷 ${t("found")}</button>`}
else if(s.st==="chk")h=dots()+`<h2>📷 ${t("scH")}</h2><p>${t("scP")}</p>${s.opts.map(id=>{const a=K[id/3|0].S[id%3];return `<button class="opt" onclick="pickObj(${id})">${qr(id)}<span><b>${a[s.lang].n}</b><small>QR · ${t("demo")}</small></span></button>`}).join("")}${s.msg?`<p class="msg">${s.msg}</p>`:""}`;
else if(s.st==="scan")h=dots()+`<h2 style="text-align:center">${t("scn")}</h2><div class="vf">${qr(s.sid)}<i></i></div>`;
else if(s.st==="rew"){const c=k(s.ki);h=dots()+`<p class="ok">${t("unl")} ${s.ln}</p><p class="ok">${t("kdone")}</p><div class="scw">${scene(s.ki)}</div><div class="card"><div class="badge">${K[s.ki].e}</div><h3>${t("bd")} ${c.n}</h3><p>${c.story}</p></div><button class="btn" onclick="nx()">${s.ki<2?t("nx"):t("fin")}</button>`}
else if(s.st==="q"){const m=t("q")[s.qi];h=dots()+`<h2>${t("qH")}</h2><p class="tag">${s.qi+1} ${t("of")} 2</p><h3>${m.q}</h3>${m.o.map((o,x)=>`<button class="opt" onclick="pickQ(${x})">${o}</button>`).join("")}`}
else if(s.st==="rw")h=`<button class="lang" onclick="closeRw()">← ${t("back")}</button><h2 style="margin-top:12px">🎁 ${t("rwH")}</h2><p>${t("rwP")}</p>${R.map((r,x)=>`<div class="card rw"><span class="em">${r.e}</span><div><b>${r[s.lang]}</b><br>${r.c} ${t("pts")}</div><button class="btn" ${s.sc<r.c?"disabled":""} onclick="redeem(${x})">${t("red")}</button></div>`).join("")}${s.cp.length?`<h3>${t("mine")}</h3>${s.cp.map(p=>`<div class="card">${R[p.x].e} ${R[p.x][s.lang]}<br><b>${t("code")} ${p.code}</b></div>`).join("")}`:""}`;
else{const n=k(s.kr).n;h=dots()+`<div style="text-align:center"><p>${t("you")}</p><div class="big">${n}</div><p>${k(s.kr).d}</p></div><div class="scw">${scene(s.kr)}${s.ph?`<div class="medal" style="background-image:url(${s.ph})"></div>`:""}</div><div class="card happy"><h3>🎉 ${t("hp1")}</h3><p>${t("hp2")}</p></div><label class="file">📸 ${t("addPh")}<input type="file" accept="image/*" capture="user" onchange="ph(this)"></label><p class="note">${t("phN")}</p><p><b>${t("score")}:</b> ${s.sc} / 1050</p><button class="btn" onclick="share()">${t("sh")}</button><button class="btn alt" onclick="openRw()">🎁 ${t("rwH")}</button><button class="btn alt" onclick="init()">${t("again")}</button>`}
N.innerHTML=nav();$.innerHTML=h;if(!keep)window.scrollTo(0,0);fx();if(s.st==="res"&&!keep)conf()}
function fx(){const els=document.querySelectorAll(".rv");if(!window.IntersectionObserver){els.forEach(e=>{e.classList.add("in");e.querySelectorAll("[data-n]").forEach(cnt)});return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");e.target.querySelectorAll("[data-n]").forEach(cnt);io.unobserve(e.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}
function cnt(el){const n=+el.dataset.n,t0=performance.now();(function f(t1){const p=Math.min(1,(t1-t0)/1200);el.textContent=Math.round(n*p);if(p<1)requestAnimationFrame(f)})(t0)}
function conf(){const d=document.createElement("div");d.className="conf";const cs=["#e1b955","#17786f","#1b4c9a","#b23a2e","#f3e3b2"];for(let i=0;i<28;i++){const e=document.createElement("i");e.style.cssText=`left:${Math.random()*100}%;background:${cs[i%5]};animation-delay:${Math.random()*1.2}s;animation-duration:${2.4+Math.random()*1.8}s`;d.appendChild(e)}document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
function tog(){s.lang=s.lang==="ar"?"en":"ar";draw(1)}
function go(){s.st="ch";draw()}
function hint(){s.h=1;s.sc=Math.max(0,s.sc-20);draw(1)}
function chk(){const id=s.ki*3+s.si,o=[...Array(9).keys()].filter(x=>(x/3|0)!==s.ki).sort(()=>Math.random()-.5).slice(0,2);o.push(id);s.opts=o.sort(()=>Math.random()-.5);s.msg="";s.st="chk";draw()}
function pickObj(id){s.sid=id;s.st="scan";draw();setTimeout(()=>{const c=s.ki*3+s.si;if(id===c){s.sc+=100;s.h=0;s.msg="";s.ln=K[s.ki].S[s.si][s.lang].n;if(s.si<2){s.si++;s.good=t("ok")+" · "+t("unl")+" "+s.ln;s.st="ch"}else{s.sc+=50;s.st="rew"}}else{s.msg=t("bad");s.st="chk"}draw()},1100)}
function nx(){s.good="";if(s.ki<2){s.ki++;s.si=0;s.h=0;s.st="ch"}else s.st="q";draw()}
function pickQ(x){s.tl[x]++;s.qi++;if(s.qi>1){s.kr=s.tl.indexOf(Math.max(...s.tl));s.st="res"}draw()}
function openRw(){s.back=s.st;s.st="rw";draw()}
function closeRw(){s.st=s.back;draw()}
function redeem(x){if(s.sc>=R[x].c){s.sc-=R[x].c;s.cp.push({x,code:"GEM-"+Math.random().toString(36).slice(2,6).toUpperCase()});draw(1)}}
function ph(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{s.ph=r.result;draw(1)};r.readAsDataURL(f)}
async function share(){const tx=t("tx").replace("{n}",k(s.kr).n).replace("{s}",s.sc);try{if(navigator.share)await navigator.share({text:tx});else{await navigator.clipboard.writeText(tx);alert(t("copied"))}}catch(e){}}
init("ar");
</script>
